[project]
name = "scqo-qm"
version = "3.8.0"
description = "Quantum Machines backend for the scqo instrument-agnostic experiment API + vendored official qualibrate calibrations"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.10,<3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
]
dependencies = [
    "quam>=0.5.0a1",
    "qualang-tools>=0.19.0",
    "qualibrate>=1.0.2",
    "qm-qua>=1.2.1",
    "tomli>=2.0.1; python_version < '3.11'",
    "quam-builder@git+https://github.com/qua-platform/quam-builder.git@v0.5.0",
    "qualibration-libs@git+https://github.com/qua-platform/qualibration-libs.git@09fc7357b7233b313827931733ae4b7d493e71b8",
    "xarray>=2024.7.0",
    "plotly>=5.24.1",
    "lmfit>=1.3.3",
    "scipy>=1.13.1",
    "qiskit-experiments>=0.9.0",
    "tqdm>=4.67.1",
    "qiskit<2.0",
    # the shared, vendor-free experiment API — a HARD dependency since the v1
    # restructure (matches scqo-qblox; kills the old `uv run` uninstall trap)
    "scqo",
]

# Advertise the QM scqo experiments so Session.catalog() finds them without a manual
# import (scqo loads this lazily on first catalog()).
[project.entry-points."scqo.experiments"]
scqo_qm = "scqo_qm.experiments"

# Advertise the QM BACKEND factory to the scqo CLI: a device whose current cooldown
# setup says `backend = "qm"` resolves to this build_backend(cfg, setup, roster)
# (re-run `uv pip install -e` after changing — entry points register at install
# time, not import time).
[project.entry-points."scqo.backends"]
qm = "scqo_qm.scqo_backend:build_backend"

[tool.uv.sources]
scqo = { path = "../SCQO", editable = true }

[tool.black]
line-length = 120

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ipykernel>=7.0.0a1", "pytest>=8.3.5"]

[tool.hatch.build.targets.wheel]
packages = ["calibrations", "calibration_utils", "quam_config", "customized", "scqo_qm"]

[tool.hatch.metadata]
allow-direct-references = true
# [tool.uv.sources]
# quam-builder = { git = "https://github.com/qua-platform/quam-builder.git" }
# qualibration-libs = { git = "https://github.com/qua-platform/qualibration-libs.git" }

[tool.pytest.ini_options]
testpaths = ["tests"]   # never collect calibrations/ (qualibrate nodes execute at import; exclude/ has *_test.py names)
