[project]
name = "scqo-qm"
version = "3.13.0"
description = "Quantum Machines backend for the scqo instrument-agnostic experiment API"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.10,<3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
]
dependencies = [
    # `quam` pulls `qualibrate-config` in, and that stays: quam reads it on every
    # serialiser lookup. `qualibrate` itself does NOT — it went with the GUI, and
    # with it the fastapi/uvicorn/sqlalchemy/psycopg2 stack it dragged into every
    # QM environment. The two `qualibration-libs` pieces this driver used are
    # vendored under scqo_qm/_vendored/ (BSD-3, upstream 09fc735).
    "quam>=0.5.0a1",
    "qualang-tools>=0.19.0",
    "qm-qua>=1.2.1",
    "tomli>=2.0.1; python_version < '3.11'",
    "quam-builder@git+https://github.com/qua-platform/quam-builder.git@v0.5.0",
    "xarray>=2024.7.0",
    "plotly>=5.24.1",
    "scipy>=1.13.1",
    # the shared, vendor-free experiment API — a HARD dependency since the v1
    # restructure (matches scqo-qblox; kills the old `uv run` uninstall trap)
    "scqo",
]

# The operator commands (scqo_qm/cli.py): `scqo-qm cluster`, `scqo-qm close-qm`, ...
# Vendor tools, deliberately NOT scqo subcommands. Like the entry points below it
# registers at install time - re-run `uv pip install -e` after changing it.
[project.scripts]
scqo-qm = "scqo_qm.cli:main"

# Advertise the QM scqo experiments so Session.catalog() finds them without a manual
# import (scqo loads this lazily on first catalog()).
[project.entry-points."scqo.experiments"]
scqo_qm = "scqo_qm.experiments"

# Advertise the QM BACKEND factory to the scqo CLI: a device whose current cooldown
# setup says `backend = "qm"` resolves to this build_backend(cfg, setup, roster)
# (re-run `uv pip install -e` after changing — entry points register at install
# time, not import time).
[project.entry-points."scqo.backends"]
qm = "scqo_qm.scqo_backend:build_backend"

[tool.uv.sources]
scqo = { path = "../SCQO", editable = true }

[tool.black]
line-length = 120

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ipykernel>=7.0.0a1", "pytest>=8.3.5"]

[tool.hatch.build.targets.wheel]
packages = ["quam_config", "scqo_qm"]

[tool.hatch.metadata]
allow-direct-references = true
# [tool.uv.sources]
# quam-builder = { git = "https://github.com/qua-platform/quam-builder.git" }

[tool.pytest.ini_options]
testpaths = ["tests"]
